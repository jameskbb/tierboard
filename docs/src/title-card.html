<!doctype html>
<!--
  Source for docs/readme-title-tierboard.png.
  Render with: node docs/src/render-title-card.mjs

  Follows the title-card convention used across the other repos: 1200x440,
  wordmark and subtitle on the left, the subject rendered on the right.
  Colours and type are Tierboard's own tokens, lifted from src/: Bricolage
  Grotesque for display, Inter for everything else.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@100..900&display=swap">
<style>
  :root {
    --bg:      #13151B;
    --bg2:     #1b1e27;
    --panel:   #1c1f28;
    --chip:    #2e3340;
    --ink:     #EEF0F4;
    --muted:   #9aa3b5;
    --accent:  #ff6b3d;
    --s: #FF7B72; --a: #FFA657; --b: #F6D55C; --f: #C49BFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 440px; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background:
      radial-gradient(900px 420px at 78% 42%, rgba(255,107,61,.10), transparent 62%),
      radial-gradient(700px 380px at 12% 28%, rgba(196,155,255,.09), transparent 60%),
      linear-gradient(145deg, var(--bg2) 0%, var(--bg) 62%, #0b0d12 100%);
    color: var(--ink);
    display: flex; align-items: center; overflow: hidden; position: relative;
  }

  .left { width: 560px; padding: 0 0 0 64px; flex: 0 0 auto; }

  .mark { display: flex; align-items: center; gap: 16px; margin-bottom: 22px; }
  .mark .glyph {
    width: 54px; height: 54px; border-radius: 13px; background: var(--ink);
    padding: 11px; display: flex; flex-direction: column; justify-content: center; gap: 5px;
  }
  .mark .glyph i { display: block; height: 7px; border-radius: 2px; }
  .mark .glyph i:nth-child(1) { width: 100%; background: var(--s); }
  .mark .glyph i:nth-child(2) { width: 74%;  background: var(--b); }
  .mark .glyph i:nth-child(3) { width: 48%;  background: #6CB8FF; }
  .mark .word { font-family: 'Bricolage Grotesque', sans-serif; font-size: 46px; font-weight: 800; letter-spacing: -.03em; }

  h1 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 42px; font-weight: 800; line-height: 1.08; letter-spacing: -.028em; }
  h1 em { font-style: normal; color: var(--accent); }
  p  { margin-top: 16px; font-size: 19px; font-weight: 400; color: var(--muted); letter-spacing: -.005em; }

  /* the subject: a board mid-rank, one chip lifted as if being dragged */
  .board {
    flex: 1 1 auto; margin-right: 54px; background: var(--panel);
    border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 11px;
    box-shadow: 0 30px 70px rgba(0,0,0,.45);
    transform: rotate(-1.4deg);
  }
  .row { display: flex; gap: 11px; align-items: stretch; }
  .tier {
    width: 62px; flex: 0 0 auto; border-radius: 11px; color: #17181d;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 27px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .slots {
    flex: 1 1 auto; background: rgba(255,255,255,.035); border-radius: 11px;
    display: flex; align-items: center; gap: 9px; padding: 9px 11px; min-height: 58px;
  }
  .chip {
    background: var(--chip); border-radius: 9px; padding: 9px 14px;
    font-size: 16px; font-weight: 600; white-space: nowrap; color: var(--ink);
  }
  .chip.drag {
    background: var(--accent); color: #1a1207;
    transform: rotate(3.5deg) translateY(-7px);
    box-shadow: 0 14px 26px rgba(255,107,61,.34);
  }
</style>
</head>
<body>
  <div class="left">
    <div class="mark">
      <span class="glyph"><i></i><i></i><i></i></span>
      <span class="word">Tierboard</span>
    </div>
    <h1>Rank anything with<br>your crew in <em>30 seconds</em>.</h1>
    <p>Paste a list. Drag into tiers. Share a link.</p>
  </div>

  <div class="board">
    <div class="row">
      <span class="tier" style="background:var(--s)">S</span>
      <span class="slots"><span class="chip">Capital Pizza</span><span class="chip">One Guy</span></span>
    </div>
    <div class="row">
      <span class="tier" style="background:var(--a)">A</span>
      <span class="slots"><span class="chip">Papa V's</span><span class="chip">Domino's</span></span>
    </div>
    <div class="row">
      <span class="tier" style="background:var(--b)">B</span>
      <span class="slots"><span class="chip">Pizza Hut</span><span class="chip drag">Slice House</span></span>
    </div>
    <div class="row">
      <span class="tier" style="background:var(--f)">F</span>
      <span class="slots"><span class="chip">Little Caesars</span></span>
    </div>
  </div>
</body>
</html>
